<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purrfect Bites | Product Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🐱 Purrfect Bites</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html" class="active-nav">Products</a>
            <a href="about.html">About Us</a>
        </nav>
        <div class="cart-icon" id="cart-toggle">
            🛒 Cart (<span id="cart-count">0</span>)
        </div>
    </header>

    <main class="detail-container">
        <div class="gallery-container">
            <div class="main-image-display" id="main-image-display">
            </div>
            <div class="thumbnail-scroll" id="thumbnail-scroll">
            </div>
        </div>

        <div class="detail-info-box">
            <h1 id="detail-title">Product Name</h1>
            <div class="detail-price" id="detail-price">$0.00</div>
            <p class="detail-description" id="detail-description">
                Loading descriptive ingredients and nutritional info from database...
            </p>

            <div class="detail-actions">
                <button class="add-btn" id="detail-add-btn">Add to Cart</button>
                <a href="products.html" class="back-link">← Back to Shop</a>
            </div>
        </div>
    </main>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button id="close-cart">✕</button>
        </div>
        <div class="cart-items" id="cart-items">
        </div>
        <div class="cart-footer">
            <div class="total-price">Total: $<span id="cart-total">0.00</span></div>
            <button class="checkout-btn" onclick="sendWhatsAppOrder()">I got my orders ready, send via WhatsApp
                💬</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
